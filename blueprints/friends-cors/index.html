<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Feed Reader with the Friends Plugin</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
                --header-padding: 8px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: var(--header-padding);
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height) - (2 * var(--header-padding)));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Feed Reader with the Friends Plugin</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            const slug = "friends-cors";

            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (localStorage.getItem(`hide-install-header-for-${slug}`) === 'true') {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                localStorage.setItem(`hide-install-header-for-${slug}`, 'true');
                hideInstallHeader();
            });
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";

            function isWordPressInstalled(slug) {
                return localStorage.getItem(`wordpress-installed-for-${slug}`) === 'true';
            }
            function setWordPressInstalled(slug) {
                localStorage.setItem(`wordpress-installed-for-${slug}`, 'true');
            }
            const shouldInstallWordPress = !isWordPressInstalled(slug);
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                mounts: [
                    {
                        mountpoint: '/wordpress',
                        device: {
                            type: 'opfs',
                            path: `/pwa-sites/${slug}`,
                        },
                    },
                ],
                shouldInstallWordPress,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Feed Reader with the Friends Plugin",
    "description": "By using the Friends plugin and a CORS proxy, you can read feeds from the web in Playground, and even via ActivityPub",
    "author": "akirk",
    "categories": [
      "rss",
      "social web"
    ]
  },
  "landingPage": "/friends/?refresh&welcome",
  "features": {
    "networking": true
  },
  "steps": [
    {
      "step": "mkdir",
      "path": "wordpress/wp-content/mu-plugins"
    },
    {
      "step": "writeFile",
      "path": "wordpress/wp-content/mu-plugins/addFilter-0.php",
      "data": "<?php add_action( 'requests-requests.before_request', function( &$url ) {\n$url = 'https://playground.wordpress.net/cors-proxy.php?' . $url;\n} );"
    },
    {
      "step": "setSiteOptions",
      "options": {
        "permalink_structure": "/%postname%/"
      }
    },
    {
      "step": "installPlugin",
      "pluginData": {
        "resource": "wordpress.org/plugins",
        "slug": "friends"
      },
      "options": {
        "activate": true
      }
    },
    {
      "step": "runPHP",
      "code": "<?php require_once 'wordpress/wp-load.php';\nif ( class_exists('Friends\\Import')) {\nFriends\\Import::opml(\"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?><opml version=\\\"2.0\\\">\n<head>\n<title>Subscriptions</title>\n</head>\n<body>\n<outline text=\\\"Subscriptions\\\" title=\\\"Subscriptions\\\">\n<outline type=\\\"rss\\\" text=\\\"Alex Kirk\\\" title=\\\"Alex Kirk\\\" xmlUrl=\\\"https://alex.kirk.at/feed/\\\" htmlUrl=\\\"https://alex.kirk.at/feed/\\\" />\n<outline type=\\\"rss\\\" text=\\\"Adam Zieli\u0144ski\\\" title=\\\"Adam Zieli\u0144ski\\\" xmlUrl=\\\"https://adamadam.blog/feed/\\\" htmlUrl=\\\"https://adamadam.blog/feed/\\\" />\n</outline>\n</body>\n</opml>\");\n}"
    },
    {
      "step": "installPlugin",
      "pluginData": {
        "resource": "wordpress.org/plugins",
        "slug": "activitypub"
      },
      "options": {
        "activate": true
      }
    }
  ]
}
            });
            await client.isReady();
            if (shouldInstallWordPress) {
                setWordPressInstalled(slug);
            }
		</script>
	</body>
</html>
