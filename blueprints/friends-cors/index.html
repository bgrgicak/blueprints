<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed Reader with Friends</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body style="margin: 0; padding: 0">
    <header
        style="display: flex; justify-content: space-between; align-items: center; padding: 4px; height: 30px; border-bottom: 1px solid #e0e0e0;"
    >
        <h1>Feed Reader with Friends</h1>
        <button id="install" hidden>
            Install
        </button>
    </header>
    <iframe id="wp" style="width: 100%; height: calc(100vh - 39px); border: 0"></iframe>
    <script type="module" async>
      /**
       * Install PWA button
       */
      let installPrompt = null;
      const installButton = document.getElementById("install");
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
        installButton.removeAttribute("hidden");
      });
      installButton.addEventListener("click", async () => {
        console.log("installButton.addEventListener", installPrompt);
        if (!installPrompt) {
          return;
        }
        const result = await installPrompt.prompt();
        console.log(`Install prompt was: ${result.outcome}`);
        disableInAppInstallPrompt();
      });

      function disableInAppInstallPrompt() {
        installPrompt = null;
        installButton.setAttribute("hidden", "");
      }

      // Boot Playground
      import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";
      const blueprint = await fetch(
        "https://raw.githubusercontent.com/bgrgicak/blueprints/refs/heads/trunk/blueprints/friends-cors/blueprint.json"
      ).then((res) => res.json());
      if (!blueprint) {
        throw new Error("Blueprint not found");
      }
      const client = await startPlaygroundWeb({
        iframe: document.getElementById("wp"),
        remoteUrl: `https://playground.wordpress.net/remote.html`,
        blueprint,
      });
      await client.isReady();
    </script>
  </body>
</html>
