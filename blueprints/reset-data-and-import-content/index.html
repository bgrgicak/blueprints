<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Reset data and import content (with logs)</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
                --header-padding: 8px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: var(--header-padding);
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height) - (2 * var(--header-padding)));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Reset data and import content (with logs)</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            const slug = "reset-data-and-import-content";

            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (localStorage.getItem(`hide-install-header-for-${slug}`) === 'true') {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                localStorage.setItem(`hide-install-header-for-${slug}`, 'true');
                hideInstallHeader();
            });
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";

            function isWordPressInstalled(slug) {
                return localStorage.getItem(`wordpress-installed-for-${slug}`) === 'true';
            }
            function setWordPressInstalled(slug) {
                localStorage.setItem(`wordpress-installed-for-${slug}`, 'true');
            }
            const shouldInstallWordPress = !isWordPressInstalled(slug);
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                mounts: [
                    {
                        mountpoint: '/wordpress',
                        device: {
                            type: 'opfs',
                            path: `/pwa-sites/${slug}`,
                        },
                    },
                ],
                shouldInstallWordPress,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Reset data and import content (with logs)",
    "description": "It resets default data before importing custom content. It also logs the state of the content after each step.",
    "author": "juanmaguitar",
    "categories": [
      "reset",
      "log",
      "debug",
      "debug",
      "import",
      "content"
    ]
  },
  "landingPage": "/wp-admin/edit.php",
  "steps": [
    {
      "step": "login",
      "username": "admin",
      "password": "password"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/mu-plugins/log_content_state.php",
      "data": "<?php  /* log_content_state() definition */  namespace MyPlayground\\Utils\\Debug; require '/wordpress/wp-load.php'; function log_content_state($message) { $args = ['post_type' => 'post', 'post_status' => 'publish', 'posts_per_page' => -1]; $posts = get_posts($args); error_log($message); if (!empty($posts)) { $last_post = $posts[count($posts) - 1]; error_log(count($posts) . ' posts - Last Post title: ' . $last_post->post_title); } else { error_log('No posts found'); } }"
    },
    {
      "step": "runPHP",
      "code": "<?php /* Log state content by default */ require '/wordpress/wp-load.php'; MyPlayground\\Utils\\Debug\\log_content_state('Last post by default');"
    },
    {
      "step": "resetData"
    },
    {
      "step": "runPHP",
      "code": "<?php /* Log state content after resetData */  require '/wordpress/wp-load.php'; MyPlayground\\Utils\\Debug\\log_content_state('Last post after resetData');"
    },
    {
      "step": "importWxr",
      "file": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress-juanmaguitar/blueprints/trunk/blueprints/reset-data-and-import-content/starter-content.xml"
      }
    },
    {
      "step": "runPHP",
      "code": "<?php /* Log state content after importWxr */ require '/wordpress/wp-load.php'; MyPlayground\\Utils\\Debug\\log_content_state('Last post after importWxr');"
    }
  ]
}
            });
            await client.isReady();
            if (shouldInstallWordPress) {
                setWordPressInstalled(slug);
            }
		</script>
	</body>
</html>
