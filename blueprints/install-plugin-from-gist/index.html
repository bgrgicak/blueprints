<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Install plugin from a gist</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
                --header-padding: 8px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: var(--header-padding);
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height) - (2 * var(--header-padding)));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Install plugin from a gist</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            const slug = "install-plugin-from-gist";

            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (localStorage.getItem(`hide-install-header-for-${slug}`) === 'true') {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                localStorage.setItem(`hide-install-header-for-${slug}`, 'true');
                hideInstallHeader();
            });
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";

            function isWordPressInstalled(slug) {
                return localStorage.getItem(`wordpress-installed-for-${slug}`) === 'true';
            }
            function setWordPressInstalled(slug) {
                localStorage.setItem(`wordpress-installed-for-${slug}`, 'true');
            }
            const shouldInstallWordPress = !isWordPressInstalled(slug);
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                mounts: [
                    {
                        mountpoint: '/wordpress',
                        device: {
                            type: 'opfs',
                            path: `/pwa-sites/${slug}`,
                        },
                    },
                ],
                shouldInstallWordPress,
                blueprint: {
  "meta": {
    "title": "Install plugin from a gist",
    "author": "zieladam",
    "description": "Install and activate a WordPress plugin from a .php file stored in a gist.",
    "categories": [
      "plugins"
    ]
  },
  "landingPage": "/wp-admin/plugins.php",
  "preferredVersions": {
    "wp": "beta",
    "php": "8.0"
  },
  "steps": [
    {
      "step": "login"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/plugins/0-plugin.php",
      "data": {
        "resource": "url",
        "url": "https://gist.githubusercontent.com/ndiego/456b74b243d86c97cda89264c68cbdee/raw/ff00cf25e6eebe4f5a4eaecff10286f71e65340b/block-hooks-demo.php"
      }
    },
    {
      "step": "activatePlugin",
      "pluginName": "Block Hooks Demo",
      "pluginPath": "0-plugin.php"
    }
  ]
}
            });
            await client.isReady();
            if (shouldInstallWordPress) {
                setWordPressInstalled(slug);
            }
		</script>
	</body>
</html>
