<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Custom Post Type: Books</title>
		<link rel="manifest" href="manifest.json" />
	</head>

	<body style="margin: 0; padding: 0">
		<header
			style="
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 4px;
				height: 30px;
				border-bottom: 1px solid #e0e0e0;
			"
		>
			<h1>Custom Post Type: Books</h1>
			<button id="install" hidden>Install</button>
		</header>
		<iframe
			id="wp"
			style="width: 100%; height: calc(100vh - 39px); border: 0"
		></iframe>
		<script type="module" async>
            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                installButton.removeAttribute("hidden");
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                disableInAppInstallPrompt();
            });

            function disableInAppInstallPrompt() {
                installPrompt = null;
                installButton.setAttribute("hidden", "");
            }

            // Boot Playground
                import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Custom Post Type: Books",
    "description": "Blueprint that added a custom post type to playground",
    "author": "bph",
    "categories": [
      "Content",
      "CPT"
    ]
  },
  "landingPage": "/wp-admin/",
  "steps": [
    {
      "step": "login"
    },
    {
      "step": "mkdir",
      "path": "/wordpress/wp-content/plugins/books"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/plugins/books/books.php",
      "data": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress/blueprints/trunk/blueprints/custom-post/books.php"
      }
    },
    {
      "step": "activatePlugin",
      "pluginPath": "books/books.php"
    }
  ]
}
            });
            await client.isReady();
		</script>
	</body>
</html>
