<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Minimal WooCommerce Setup with Sample Products, Shipping, and Payment Method</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px;
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Minimal WooCommerce Setup with Sample Products, Shipping, and Payment Method</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (isInstallHeaderHidden()) {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                saveHideInstallHeader();
                hideInstallHeader();
            });
            function saveHideInstallHeader() {
                localStorage.setItem("hideInstallHeader", "true");
            }
            function isInstallHeaderHidden() {
                return localStorage.getItem("hideInstallHeader") === "true";
            }
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Minimal WooCommerce Setup with Sample Products, Shipping, and Payment Method",
    "description": "To create a WordPress Playground instance that installs WooCommerce, adds a custom flat rate shipping method via a plugin, imports WooCommerce sample products XML to demonstrate the shipping method on the cart/checkout pages, and enables the Direct Bank Transfer payment method.",
    "author": "calvinrodrigues500",
    "categories": [
      "woocommerce",
      "shipping",
      "flat_rate"
    ]
  },
  "steps": [
    {
      "step": "setSiteOptions",
      "options": {
        "blogName": "Woo Shipping Method"
      }
    },
    {
      "step": "installPlugin",
      "pluginZipFile": {
        "resource": "wordpress.org/plugins",
        "slug": "woocommerce"
      }
    },
    {
      "step": "importWxr",
      "file": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/calvinrodrigues500/blueprints/woo-shipping/blueprints/woo-shipping/sample_products.xml"
      }
    },
    {
      "step": "mkdir",
      "path": "/wordpress/wp-content/plugins/woo-shipping-method"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/plugins/woo-shipping-method/woo-shipping-method.php",
      "data": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/calvinrodrigues500/blueprints/woo-shipping/blueprints/woo-shipping/woo-shipping-method/woo-shipping-method.php"
      }
    },
    {
      "step": "activatePlugin",
      "pluginName": "woo-shipping-method",
      "pluginPath": "woo-shipping-method/woo-shipping-method.php"
    }
  ]
}
            });
            await client.isReady();
		</script>
	</body>
</html>
