<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Stylish Press</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px;
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Stylish Press</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (isInstallHeaderHidden()) {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                saveHideInstallHeader();
                hideInstallHeader();
            });
            function saveHideInstallHeader() {
                localStorage.setItem("hideInstallHeader", "true");
            }
            function isInstallHeaderHidden() {
                return localStorage.getItem("hideInstallHeader") === "true";
            }
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Stylish Press",
    "description": "A Woo store with custom theme, content, and products.",
    "author": "adamziel",
    "categories": [
      "Woocommerce",
      "Site"
    ]
  },
  "landingPage": "/shop",
  "preferredVersions": {
    "php": "8.3",
    "wp": "6.6"
  },
  "features": {
    "networking": true
  },
  "steps": [
    {
      "step": "resetData"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/mu-plugins/rewrite.php",
      "data": "<?php /* Use pretty permalinks */ add_action( 'after_setup_theme', function() { global $wp_rewrite; $wp_rewrite->set_permalink_structure('/%postname%/'); $wp_rewrite->flush_rules(); } );"
    },
    {
      "step": "setSiteOptions",
      "options": {
        "blogname": "Stylish Press",
        "woocommerce_store_city": "Wroc\u0142aw",
        "woocommerce_store_address": "Aleje Jerozolimskie 14",
        "woocommerce_store_postcode": "00-153",
        "woocommerce_default_country": "Poland",
        "woocommerce_onboarding_profile": {
          "skipped": true
        },
        "woocommerce_currency": "PLN",
        "woocommerce_weight_unit": "oz",
        "woocommerce_dimension_unit": "in",
        "woocommerce_allow_tracking": "no",
        "woocommerce_cheque_settings": {
          "enabled": "yes"
        }
      }
    },
    {
      "step": "installPlugin",
      "pluginZipFile": {
        "resource": "wordpress.org/plugins",
        "slug": "woocommerce"
      },
      "options": {
        "activate": true
      }
    },
    {
      "step": "importWxr",
      "file": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress/blueprints/trunk/blueprints/stylish-press/woo-products.wxr"
      }
    },
    {
      "step": "importWxr",
      "file": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress/blueprints/trunk/blueprints/stylish-press/site-content.wxr"
      }
    },
    {
      "step": "mkdir",
      "path": "/wordpress/wp-content/themes/stylish-press-theme"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/themes/stylish-press-theme/style.css",
      "data": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/WordPress/blueprints/stylish-press/blueprints/stylish-press/stylish-press-theme/style.css"
      }
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/themes/stylish-press-theme/theme.json",
      "data": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress/blueprints/trunk/blueprints/stylish-press/stylish-press-theme/theme.json"
      }
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/themes/stylish-press-theme/functions.php",
      "data": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress/blueprints/trunk/blueprints/stylish-press/stylish-press-theme/functions.php"
      }
    },
    {
      "step": "mkdir",
      "path": "/wordpress/wp-content/themes/stylish-press-theme/parts"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/themes/stylish-press-theme/parts/header.html",
      "data": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/wordpress/blueprints/trunk/blueprints/stylish-press/stylish-press-theme/parts/header.html"
      }
    },
    {
      "step": "activateTheme",
      "themeFolderName": "stylish-press-theme"
    },
    {
      "step": "login",
      "username": "admin",
      "password": "password"
    }
  ]
}
            });
            await client.isReady();
		</script>
	</body>
</html>
