<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Serve media files from another host</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px;
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Serve media files from another host</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (isInstallHeaderHidden()) {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                saveHideInstallHeader();
                hideInstallHeader();
            });
            function saveHideInstallHeader() {
                localStorage.setItem("hideInstallHeader", "true");
            }
            function isInstallHeaderHidden() {
                return localStorage.getItem("hideInstallHeader") === "true";
            }
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Serve media files from another host",
    "description": "Redirect any requests to files within the uploads directory to an external host. This is useful when you have a lot of image attachments in your playground but don\u2019t want to include them all in the blueprint.",
    "author": "ivanblagdan",
    "categories": [
      "Settings"
    ]
  },
  "landingPage": "/category/uncategorized/",
  "constants": {
    "PLAYGROUND_REDIRECT_UPLOADS_URL": "https://production.example.com"
  },
  "steps": [
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/mu-plugins/redirect-uploads.php",
      "data": "<?php add_action('init', function() { if (!defined('PLAYGROUND_REDIRECT_UPLOADS_URL')) exit; $request_uri = $_SERVER['REQUEST_URI']; $uploads_position = strpos($request_uri, '/wp-content/uploads'); if ($uploads_position !== false) { $uploads_path = substr($request_uri, $uploads_position); $redirect_url = PLAYGROUND_REDIRECT_UPLOADS_URL . $uploads_path; wp_redirect($redirect_url, 302); exit; } });"
    }
  ]
}
            });
            await client.isReady();
		</script>
	</body>
</html>
