<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Loading, activating, and configuring a theme from a GitHub repository.</title>
		<link rel="manifest" href="manifest.json" />
	</head>

	<body style="margin: 0; padding: 0">
		<header
			style="
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 4px;
				height: 30px;
				border-bottom: 1px solid #e0e0e0;
			"
		>
			<h1>Loading, activating, and configuring a theme from a GitHub repository.</h1>
			<button id="install" hidden>Install</button>
		</header>
		<iframe
			id="wp"
			style="width: 100%; height: calc(100vh - 39px); border: 0"
		></iframe>
		<script type="module" async>
            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                installButton.removeAttribute("hidden");
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                disableInAppInstallPrompt();
            });

            function disableInAppInstallPrompt() {
                installPrompt = null;
                installButton.setAttribute("hidden", "");
            }

            // Boot Playground
                import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Loading, activating, and configuring a theme from a GitHub repository.",
    "description": "This is a good example of typical steps used on a theme's loading, activation and configuration",
    "author": "richtabor",
    "categories": [
      "theme"
    ]
  },
  "landingPage": "/wp-admin/site-editor.php",
  "login": true,
  "features": {
    "networking": true
  },
  "steps": [
    {
      "step": "resetData"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/mu-plugins/rewrite.php",
      "data": "<?php /* Use pretty permalinks */ add_action( 'after_setup_theme', function() { global $wp_rewrite; $wp_rewrite->set_permalink_structure('/%postname%/'); $wp_rewrite->flush_rules(); } );"
    },
    {
      "step": "updateUserMeta",
      "meta": {
        "first_name": "Rich",
        "last_name": "Tabor",
        "admin_color": "modern"
      },
      "userId": 1
    },
    {
      "step": "installTheme",
      "themeZipFile": {
        "resource": "url",
        "url": "https://github-proxy.com/proxy/?repo=richtabor/kanso&branch=main"
      },
      "options": {
        "activate": true
      }
    },
    {
      "step": "importWxr",
      "file": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/WordPress/blueprints/trunk/blueprints/install-activate-setup-theme-from-gh-repo/blueprint-content.xml"
      }
    },
    {
      "step": "setSiteOptions",
      "options": {
        "blogname": "Rich Tabor",
        "blogdescription": "Multidisciplinary maker specializing in the intersection of product, design and engineering. Making WordPress.",
        "show_on_front": "page",
        "page_on_front": 6,
        "page_for_posts": 2
      }
    }
  ],
  "plugins": [
    "todo-list-block",
    "markdown-comment-block"
  ]
}
            });
            await client.isReady();
		</script>
	</body>
</html>
