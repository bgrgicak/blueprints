<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Loading, activating, and configuring a theme from a GitHub repository.</title>
		<link rel="manifest" href="manifest.json" />
        <style>
            :root {
                --header-height: 39px;
                --header-padding: 8px;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .install-header {
                height: var(--header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: var(--header-padding);
                background-color: #1e2327;
            }

            .install-button {
                color: #9ba2a6;
                background: #2b2a33;
                border: none;
                padding: 8px 16px;
                cursor: pointer;
                border-radius: 4px;
            }

            .install-button:hover {
                background: #9ba2a6;
                color: #1e2327;
            }

            #closeInstall {
                font-size: 24px;
                line-height: 15px;
            }

            #wp {
                width: 100%;
                height: calc(100vh - var(--header-height) - (2 * var(--header-padding)));
                border: 0;
            }

            .hide-install-header .install-header {
                display: none;
            }
            .hide-install-header #wp {
                height: 100vh;
            }
        </style>
	</head>

	<body class="hide-install-header">
		<header class="install-header">
			<button id="install" class="install-button">Install Loading, activating, and configuring a theme from a GitHub repository.</button>
			<button id="closeInstall" class="install-button">×</button>
		</header>
		<iframe id="wp"></iframe>
		<script type="module" async>
            const slug = "install-activate-setup-theme-from-gh-repo";

            /**
             * Install PWA button
             */
            let installPrompt = null;
            const installButton = document.getElementById("install");
            const closeInstallButton = document.getElementById("closeInstall");
            const installHeader = document.querySelector(".install-header");
            window.addEventListener("beforeinstallprompt", (event) => {
                event.preventDefault();
                installPrompt = event;
                if (localStorage.getItem(`hide-install-header-for-${slug}`) === 'true') {
                    hideInstallHeader();
                } else {
                    showInstallHeader();
                }
            });
            installButton.addEventListener("click", async () => {
                if (!installPrompt) {
                    return;
                }
                const result = await installPrompt.prompt();
                installPrompt = null;
                hideInstallHeader();
            });
            closeInstallButton.addEventListener("click", () => {
                localStorage.setItem(`hide-install-header-for-${slug}`, 'true');
                hideInstallHeader();
            });
            function hideInstallHeader() {
                document.body.classList.add("hide-install-header");
            }
            function showInstallHeader() {
                document.body.classList.remove("hide-install-header");
            }

            // Boot Playground
            import { startPlaygroundWeb } from "https://playground.wordpress.net/client/index.js";

            function isWordPressInstalled(slug) {
                return localStorage.getItem(`wordpress-installed-for-${slug}`) === 'true';
            }
            function setWordPressInstalled(slug) {
                localStorage.setItem(`wordpress-installed-for-${slug}`, 'true');
            }
            const shouldInstallWordPress = !isWordPressInstalled(slug);
            const client = await startPlaygroundWeb({
                iframe: document.getElementById("wp"),
                remoteUrl: `https://playground.wordpress.net/remote.html`,
                mounts: [
                    {
                        mountpoint: '/wordpress',
                        device: {
                            type: 'opfs',
                            path: `/pwa-sites/${slug}`,
                        },
                    },
                ],
                shouldInstallWordPress,
                blueprint: {
  "$schema": "https://playground.wordpress.net/blueprint-schema.json",
  "meta": {
    "title": "Loading, activating, and configuring a theme from a GitHub repository.",
    "description": "This is a good example of typical steps used on a theme's loading, activation and configuration",
    "author": "richtabor",
    "categories": [
      "theme"
    ]
  },
  "landingPage": "/wp-admin/site-editor.php",
  "login": true,
  "features": {
    "networking": true
  },
  "steps": [
    {
      "step": "resetData"
    },
    {
      "step": "writeFile",
      "path": "/wordpress/wp-content/mu-plugins/rewrite.php",
      "data": "<?php /* Use pretty permalinks */ add_action( 'after_setup_theme', function() { global $wp_rewrite; $wp_rewrite->set_permalink_structure('/%postname%/'); $wp_rewrite->flush_rules(); } );"
    },
    {
      "step": "updateUserMeta",
      "meta": {
        "first_name": "Rich",
        "last_name": "Tabor",
        "admin_color": "modern"
      },
      "userId": 1
    },
    {
      "step": "installTheme",
      "themeZipFile": {
        "resource": "url",
        "url": "https://github-proxy.com/proxy/?repo=richtabor/kanso&branch=main"
      },
      "options": {
        "activate": true
      }
    },
    {
      "step": "importWxr",
      "file": {
        "resource": "url",
        "url": "https://raw.githubusercontent.com/WordPress/blueprints/trunk/blueprints/install-activate-setup-theme-from-gh-repo/blueprint-content.xml"
      }
    },
    {
      "step": "setSiteOptions",
      "options": {
        "blogname": "Rich Tabor",
        "blogdescription": "Multidisciplinary maker specializing in the intersection of product, design and engineering. Making WordPress.",
        "show_on_front": "page",
        "page_on_front": 6,
        "page_for_posts": 2
      }
    }
  ],
  "plugins": [
    "todo-list-block",
    "markdown-comment-block"
  ]
}
            });
            await client.isReady();
            if (shouldInstallWordPress) {
                setWordPressInstalled(slug);
            }
		</script>
	</body>
</html>
